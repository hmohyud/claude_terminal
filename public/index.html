<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>claude terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e14'/%3E%3Ctext x='7' y='23' font-family='monospace' font-size='18' fill='%237ee787'%3E%E2%9D%AF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login" class="screen hidden">
  <form id="login-form" class="login-box" autocomplete="off">
    <div class="login-title"><span class="accent">❯</span> claude terminal</div>
    <div class="login-sub">enter the password to unlock this terminal</div>
    <input id="password" type="password" placeholder="password" autocomplete="current-password" required>
    <button type="submit" id="login-btn">unlock</button>
    <div id="login-error" class="login-error" role="alert"></div>
    <div class="login-fine">you stay signed in on this browser for 30 days</div>
  </form>
</div>

<div id="app" class="screen hidden">
  <aside id="sidebar">
    <div class="side-head">
      <button id="new-conv" class="wide">+ new chat</button>
    </div>
    <div id="conv-list"></div>
    <div class="side-foot">
      <button id="files-btn" class="ghost">files</button>
      <button id="usage-btn" class="ghost">usage</button>
      <button id="logout" class="ghost">logout</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="toggle-sidebar" class="icon" title="toggle sidebar">☰</button>
      <span id="conv-title" class="title" title="double-click to rename">new chat</span>
      <span class="spacer"></span>
      <label class="ctl">model <select id="model"></select></label>
      <label class="ctl">effort <select id="effort"></select></label>
      <label class="ctl check"><input type="checkbox" id="thinking"> thinking</label>
      <button id="usage-chip" class="chip" title="usage and remaining budget">usage</button>
    </header>

    <div id="transcript" tabindex="-1"></div>

    <form id="composer">
      <div id="attachments" class="hidden"></div>
      <div class="row">
        <span class="prompt">❯</span>
        <textarea id="input" rows="1" placeholder="message claude…  (/help for commands, drop files anywhere)" spellcheck="false"></textarea>
        <button type="button" id="attach" class="icon" title="attach files">⎙</button>
        <button type="submit" id="send" class="icon" title="send (Enter)">⏎</button>
        <button type="button" id="stop" class="icon hidden" title="stop (Esc)">■</button>
      </div>
      <div class="hint"><span id="hint-left">enter to send · shift+enter newline · ↑ history</span><span id="conv-stats"></span></div>
      <input type="file" id="file" multiple hidden>
    </form>
  </main>

  <div id="drop-overlay" class="hidden"><div>drop files to attach</div></div>

  <!-- usage panel -->
  <div id="usage-panel" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span>usage &amp; remaining</span><button class="icon close" data-close="usage-panel">×</button></div>
      <div id="usage-body" class="modal-body">loading…</div>
    </div>
  </div>

  <!-- files panel -->
  <div id="files-panel" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span>files</span><span class="spacer"></span><button id="files-upload" class="small">upload</button><button class="icon close" data-close="files-panel">×</button></div>
      <div id="files-body" class="modal-body">loading…</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
