# Runs the terminal in a container. Your API key and password go in a .env
# file next to this file (deploy/server-setup.sh writes it for you, or copy
# .env.example). Uploads, usage history, the budget and the login secret live
# in a named volume so rebuilds keep them.
#
#   docker compose up -d --build
#
# BIND_ADDR in .env picks which interface gets the port:
#   127.0.0.1 (default) = this machine only; 0.0.0.0 = your whole network.
services:
  claude-terminal:
    build: .
    image: claude-terminal:latest
    container_name: claude-terminal
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3123"
      DATA_DIR: /data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3123}:3123"
    volumes:
      - claude-terminal-data:/data

  # Optional automatic HTTPS. Turned on when .env has COMPOSE_PROFILES=https and
  # DOMAIN=your.domain.com (deploy/server-setup.sh sets both when you give it a
  # domain). Caddy fetches and renews the certificate by itself.
  caddy:
    image: caddy:2
    container_name: claude-terminal-caddy
    restart: unless-stopped
    profiles: ["https"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to claude-terminal:3123
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - claude-terminal

volumes:
  claude-terminal-data:
  caddy-data:
  caddy-config:
