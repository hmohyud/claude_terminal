# Every push runs the checks. Pushes to main then deploy the Worker to
# Cloudflare (with Wrangler) and the frontend to GitHub Pages.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard (Workers & Pages → overview)
#   ANTHROPIC_API_KEY       your Anthropic API key
#   ACCESS_KEY              the private key that unlocks the terminal (long and random)
#
# GitHub Pages must be set to "GitHub Actions" as its source; the pages job
# turns that on if it can.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check worker/index.js && node --check public/app.js
      - run: npm test
      - name: Are the deploy secrets set?
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_ACCESS_KEY: ${{ secrets.ACCESS_KEY != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ] && [ "$HAS_API_KEY" = "true" ] && [ "$HAS_ACCESS_KEY" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped. Add the four repository secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, ACCESS_KEY) to deploy. See README.md."
          fi

  worker:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the four secrets exist
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi
          if [ "${#ACCESS_KEY}" -lt 8 ]; then echo "::error::ACCESS_KEY must be at least 8 characters (20+ random characters recommended)."; exit 1; fi
      - name: Create the KV namespace if needed
        run: node scripts/kv.mjs
      - name: Deploy the Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var ALLOWED_ORIGIN:https://${{ github.repository_owner }}.github.io
          secrets: |
            ANTHROPIC_API_KEY
            ACCESS_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}

  pages:
    needs: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Point the page at the Worker
        env:
          WORKER_URL: ${{ needs.worker.outputs.url }}
        run: |
          ORIGIN="${WORKER_URL%/}"
          if [ -z "$ORIGIN" ]; then echo "::error::The Worker deploy did not report a URL."; exit 1; fi
          printf 'window.CT_API = "%s";\n' "$ORIGIN" > public/config.js
          sed -i "s#__WORKER_ORIGIN__#$ORIGIN#g" public/index.html
          echo "API: $ORIGIN"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
